<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sitio en mantenimiento</title>
    <style>
      :root {
        color-scheme: light;
        --primary: #4f46e5;
        --text: #1f2933;
        --muted: #6b7280;
        --border: #e5e7eb;
        --bg: #f5f6fa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      main {
        width: min(100%, 680px);
        padding: clamp(28px, 6vw, 52px);
        border: 1px solid var(--border);
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 22px 60px rgba(15, 23, 42, 0.08);
        text-align: center;
      }

      .mark {
        width: 58px;
        height: 58px;
        display: grid;
        place-items: center;
        margin: 0 auto 22px;
        border-radius: 16px;
        background: rgba(79, 70, 229, 0.1);
        color: var(--primary);
        font-weight: 800;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.7rem, 5vw, 2.45rem);
        line-height: 1.12;
      }

      p {
        margin: 16px auto 0;
        max-width: 520px;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.6;
      }

      small {
        display: block;
        margin-top: 24px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">IA</div>
      <h1>Sitio en mantenimiento</h1>
      <p>
        Estamos realizando tareas de actualización. El sitio volverá a estar
        disponible en breve.
      </p>
      <small>Iglesia Adventista del Séptimo Día</small>
    </main>
  </body>
</html>
